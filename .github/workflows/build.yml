name: Build AuroraRP

# Запуск: вручную (Actions → Build AuroraRP → Run workflow) или автоматически при пуше тега.
on:
  workflow_dispatch:
  push:
    tags:
      - 'aurorarp-v*'

permissions:
  contents: write

jobs:
  build:
    name: Собрать плагин и упаковать релиз
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: MelonLoader 0.6.6 (нужен только MelonLoader.dll и net6-зависимости)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stage/melon stage/bonelab
          gh release download v0.6.6 -R LavaGang/MelonLoader -p "MelonLoader.x64.zip" -D stage/melon
          unzip -q stage/melon/MelonLoader.x64.zip -d stage/bonelab
          echo "--- что приехало ---"
          ls stage/bonelab | head -20
          ls stage/bonelab/net6 | head -20

      - name: Собрать AuroraRPUpdater.dll
        run: |
          dotnet build AuroraRP/Updater/AuroraRPUpdater.csproj \
            -c Release -o out \
            -p:BonelabDir="$PWD/stage/bonelab"
          ls -la out

      - name: Зависимости мода (BoneLib + LabFusion, публичные релизы)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stage/bonelab/Mods
          gh release download v3.2.2 -R yowchap/BoneLib -p "BoneLib.zip" -D stage/mods
          unzip -q -o stage/mods/BoneLib.zip -d stage/mods/unpacked || true
          find stage/mods/unpacked -name "BoneLib.dll" -exec cp {} stage/bonelab/Mods/ \; || true
          gh release download v1.14.2 -R Lakatrazz/BONELAB-Fusion -p "LabFusion.dll" -D stage/bonelab/Mods
          ls -la stage/bonelab/Mods

      - name: Собрать мод (если в секретах есть игровые сборки)
        env:
          ASSEMBLIES_URL: ${{ secrets.BONELAB_ASSEMBLIES_URL }}
          ASSEMBLIES_PAT: ${{ secrets.BONELAB_ASSEMBLIES_PAT }}
          ASSEMBLIES_REPO: ${{ secrets.BONELAB_ASSEMBLIES_REPO }}
        run: |
          # Игровые сборки можно положить либо по прямой ссылке (BONELAB_ASSEMBLIES_URL),
          # либо ассетом в приватном репозитории (BONELAB_ASSEMBLIES_REPO + PAT).
          if [ -z "$ASSEMBLIES_URL" ] && [ -n "$ASSEMBLIES_REPO" ] && [ -n "$ASSEMBLIES_PAT" ]; then
            mkdir -p stage/private
            GH_TOKEN="$ASSEMBLIES_PAT" gh release download -R "$ASSEMBLIES_REPO" \
              -p "*.zip" -D stage/private --clobber || true
            ASSEMBLIES_URL=$(ls stage/private/*.zip 2>/dev/null | head -1)
            if [ -n "$ASSEMBLIES_URL" ]; then ASSEMBLIES_URL="file://$ASSEMBLIES_URL"; fi
          fi

          if [ -z "$ASSEMBLIES_URL" ]; then
            echo "BONELAB_ASSEMBLIES_URL не задан — мод соберётся в Unity (AuroraRP → 3. СОБРАТЬ ВСЁ)."
            echo "Чтобы CI собрал и AuroraRP.dll, положите zip с игровыми сборками"
            echo "(BONELAB_Data/il2cpp/MelonLoader/Il2CppAssemblies) по ссылке в секрете."
            exit 0
          fi
          mkdir -p stage/bonelab/Il2CppAssemblies
          case "$ASSEMBLIES_URL" in
            file://*) cp "${ASSEMBLIES_URL#file://}" stage/assemblies.zip ;;
            *) curl -sSL "$ASSEMBLIES_URL" -o stage/assemblies.zip ;;
          esac
          unzip -q stage/assemblies.zip -d stage/assemblies_raw
          find stage/assemblies_raw -name "Il2Cpp*.dll" -o -name "Assembly-CSharp*.dll" -o -name "UnityEngine*.dll" | head -5
          find stage/assemblies_raw -name "*.dll" -exec cp -n {} stage/bonelab/Il2CppAssemblies/ \;
          dotnet build "AuroraRP/Mod~/AuroraRP.csproj" \
            -c Release -o out \
            -p:BonelabDir="$PWD/stage/bonelab"
          ls -la out

      - name: Thunderstore-пакет (плагин + мод, если он собрался)
        run: |
          cd AuroraRP/Thunderstore
          mkdir -p Plugins Mods
          cp ../../out/AuroraRPUpdater.dll Plugins/ || true
          cp ../../out/AuroraRP.dll Mods/ || true
          rm -f ../../out/AuroraRP-Thunderstore-1.0.0.zip
          zip -q -r ../../out/AuroraRP-Thunderstore-1.0.0.zip manifest.json README.md icon.png Plugins Mods
          echo "--- что попало в пакет ---"
          unzip -l ../../out/AuroraRP-Thunderstore-1.0.0.zip

      - name: Собрать палет-архив из закоммиченного контента (pallet.json + config)
        run: |
          mkdir -p out
          cd AuroraRP/Pallet
          zip -q -r "../../out/AuroraRP-pallet-src-1.0.0.zip" . -x "ServerData/*"

      - name: Архив проекта целиком (весь код + инструкция)
        run: |
          mkdir -p stage/archive/AuroraRP-1.0.0
          git -c core.quotepath=false ls-files \
            | grep -E '^(AuroraRP/|\.github/)|^(ПРОЧТИ_МЕНЯ\.md|README\.md|release-notes\.md|\.gitignore|СОБРАТЬ_DLL\.cmd|собрать_dll\.sh)$' \
            > stage/archive/list.txt
          cat stage/archive/list.txt
          xargs -a stage/archive/list.txt cp --parents -t stage/archive/AuroraRP-1.0.0
          (cd stage/archive && zip -q -r "$GITHUB_WORKSPACE/out/AuroraRP-1.0.0-complete.zip" AuroraRP-1.0.0)
          unzip -l out/AuroraRP-1.0.0-complete.zip | tail -3

      - name: Список файлов для релиза
        run: |
          mkdir -p release
          for f in AuroraRPUpdater.dll AuroraRP-Thunderstore-1.0.0.zip AuroraRP-pallet-src-1.0.0.zip AuroraRP-1.0.0-complete.zip AuroraRP.dll; do
            cp "out/$f" "release/$f" 2>/dev/null || true
          done
          echo "--- уедет в релиз ---"
          ls -la release

      - name: Приложить файлы к релизу
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber

      - name: Итог
        run: |
          {
            echo "### AuroraRP: сборка готова"
            echo
            echo "| файл | размер |"
            echo "|---|---|"
            for f in out/*; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(stat -c%s "$f") байт |"
            done
            echo
            if [ -f out/AuroraRP.dll ]; then
              echo "Мод собран целиком (были игровые сборки)."
            else
              echo "Мод (AuroraRP.dll) и палет собираются в Unity: **AuroraRP → 3. СОБРАТЬ ВСЁ**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: AuroraRP-build
          path: out/*
          if-no-files-found: warn
