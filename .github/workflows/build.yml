name: Build AuroraRP

# Запуск: вручную (Actions → Build AuroraRP → Run workflow) или автоматически при пуше тега.
#
# Игровые сборки (Il2CppAssemblies) ищутся по очереди:
#   1) ссылка из поля assemblies_url при ручном запуске или из секрета BONELAB_ASSEMBLIES_URL;
#   2) приватный репозиторий: секреты BONELAB_ASSEMBLIES_REPO + BONELAB_ASSEMBLIES_PAT;
#   3) черновик (draft) релиза в этом же репозитории с zip-архивом сборок — без секретов;
#   4) публичный репозиторий ItzHanchik/bonelab-workspace (релиз или git-клон).
# Если сборки не найдены — собирается только плагин автообновления.
#
# Если в любом из архивов лежит aurorarp.pack (красота из Unity) — он вшивается в AuroraRP.dll.
on:
  workflow_dispatch:
    inputs:
      assemblies_url:
        description: 'Ссылка на zip с Il2CppAssemblies (необязательно; значение остаётся в логе запуска)'
        required: false
        default: ''
  push:
    tags:
      - 'aurorarp-v*'

permissions:
  contents: write

jobs:
  build:
    name: Собрать мод, плагин и упаковать релиз
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: MelonLoader 0.6.6 (нужен только MelonLoader.dll и net6-зависимости)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stage/melon stage/bonelab
          gh release download v0.6.6 -R LavaGang/MelonLoader -p "MelonLoader.x64.zip" -D stage/melon
          unzip -q stage/melon/MelonLoader.x64.zip -d stage/bonelab
          echo "--- что приехало ---"
          ls stage/bonelab | head -20
          ls stage/bonelab/net6 | head -20

      - name: Игровые сборки BONELAB (ищем все доступные источники)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRECT_URL: ${{ inputs.assemblies_url || secrets.BONELAB_ASSEMBLIES_URL }}
          PRIVATE_REPO: ${{ secrets.BONELAB_ASSEMBLIES_REPO }}
          PRIVATE_PAT: ${{ secrets.BONELAB_ASSEMBLIES_PAT }}
          WORKSPACE_REPO: ItzHanchik/bonelab-workspace
        run: |
          mkdir -p stage/assemblies_raw stage/assemblies_zip stage/public
          ZIP=""

          # 1) прямая ссылка
          if [ -z "$ZIP" ] && [ -n "$DIRECT_URL" ]; then
            case "$DIRECT_URL" in
              file://*) ZIP="${DIRECT_URL#file://}" ;;
              *) curl -sSL "$DIRECT_URL" -o stage/assemblies_zip/direct.zip && ZIP=stage/assemblies_zip/direct.zip ;;
            esac
            echo "Источник сборок: ссылка"
          fi

          # 2) приватный репозиторий по токену
          if [ -z "$ZIP" ] && [ -n "$PRIVATE_REPO" ] && [ -n "$PRIVATE_PAT" ]; then
            GH_TOKEN="$PRIVATE_PAT" gh release download -R "$PRIVATE_REPO" -p "*.zip" -D stage/assemblies_zip --clobber || true
            ZIP=$(ls stage/assemblies_zip/*.zip 2>/dev/null | head -1)
            if [ -n "$ZIP" ]; then echo "Источник сборок: приватный репозиторий $PRIVATE_REPO"; fi
          fi

          # 3) черновик релиза в этом же репозитории (без секретов).
          #    REST-API черновики для токена Actions не отдаёт, поэтому идём через GraphQL.
          if [ -z "$ZIP" ]; then
            OWNER="${GITHUB_REPOSITORY%/*}"
            REPO="${GITHUB_REPOSITORY#*/}"
            QUERY='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){releases(first:50,orderBy:{field:CREATED_AT,direction:DESC}){nodes{tagName isDraft releaseAssets(first:50){nodes{name url}}}}}}'
            gh api graphql -f query="$QUERY" -F owner="$OWNER" -F repo="$REPO" \
              --jq '.data.repository.releases.nodes[] | select(.isDraft) | .releaseAssets.nodes[] | select(.name | endswith(".zip")) | "\(.name)\t\(.url)"' \
              > stage/draft_assets.txt 2>/dev/null || true

            while IFS=$'\t' read -r name url; do
              [ -z "$url" ] && continue
              echo "Качаю из черновика: $name"
              gh api "$url" -H "Accept: application/octet-stream" > "stage/assemblies_zip/$name" 2>/dev/null || true
            done < stage/draft_assets.txt

            ZIP=$(ls stage/assemblies_zip/*.zip 2>/dev/null | head -1)
            if [ -n "$ZIP" ]; then echo "Источник сборок: черновик релиза в этом репозитории"; fi
          fi

          # 4) репозиторий bonelab-workspace (если он публичный)
          if [ -z "$ZIP" ]; then
            gh release download -R "$WORKSPACE_REPO" -p "*.zip" -D stage/assemblies_zip --clobber 2>/dev/null || true
            ZIP=$(ls stage/assemblies_zip/*.zip 2>/dev/null | head -1)
            if [ -n "$ZIP" ]; then
              echo "Источник сборок: релиз $WORKSPACE_REPO"
            else
              if git clone --depth 1 "https://github.com/$WORKSPACE_REPO" stage/public 2>/dev/null; then
                DIR=$(find stage/public -type d -name Il2CppAssemblies 2>/dev/null | head -1)
                if [ -n "$DIR" ]; then
                  cp -r "$DIR"/. stage/assemblies_raw/
                  echo "Источник сборок: git-клон $WORKSPACE_REPO"
                fi
              fi
            fi
          fi

          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d stage/assemblies_raw
          fi

          # Красота из Unity: если в архивах есть aurorarp.pack — вшиваем её в DLL
          PACK=$(find stage/assemblies_raw -name "aurorarp.pack" 2>/dev/null | head -1)
          if [ -n "$PACK" ]; then
            mkdir -p "AuroraRP/Mod~/Runtime/Assets"
            cp "$PACK" "AuroraRP/Mod~/Runtime/Assets/aurorarp.pack"
            echo "Красота: aurorarp.pack найден и будет вшит в DLL"
          else
            echo "Красота: aurorarp.pack не найден — DLL соберётся с кодовой отрисовкой"
          fi

          COUNT=$(find stage/assemblies_raw -name "*.dll" 2>/dev/null | wc -l)
          echo "Найдено DLL игровых сборок: $COUNT"
          find stage/assemblies_raw -name "*.dll" 2>/dev/null | head -5
          echo "ASSEMBLIES_FOUND=$( [ "$COUNT" -gt 0 ] && echo yes || echo no )" >> "$GITHUB_ENV"

      - name: Собрать AuroraRPUpdater.dll
        run: |
          dotnet build AuroraRP/Updater/AuroraRPUpdater.csproj \
            -c Release -o out \
            -p:BonelabDir="$PWD/stage/bonelab"
          ls -la out

      - name: Зависимости мода (BoneLib + LabFusion, публичные релизы)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stage/bonelab/Mods
          gh release download v3.2.2 -R yowchap/BoneLib -p "BoneLib.zip" -D stage/mods
          unzip -q -o stage/mods/BoneLib.zip -d stage/mods/unpacked || true
          find stage/mods/unpacked -name "BoneLib.dll" -exec cp {} stage/bonelab/Mods/ \; || true
          gh release download v1.14.2 -R Lakatrazz/BONELAB-Fusion -p "LabFusion.dll" -D stage/bonelab/Mods
          ls -la stage/bonelab/Mods

      - name: Собрать мод AuroraRP.dll (нужны игровые сборки — см. их поиск выше)
        if: env.ASSEMBLIES_FOUND == 'yes'
        continue-on-error: true
        run: |
          mkdir -p stage/bonelab/Il2CppAssemblies
          find stage/assemblies_raw -name "*.dll" -exec cp -n {} stage/bonelab/Il2CppAssemblies/ \;
          echo "IL2CPP-сборок: $(ls stage/bonelab/Il2CppAssemblies | wc -l)"
          set +e
          dotnet build "AuroraRP/Mod~/AuroraRP.csproj" \
            -c Release -o out \
            -p:BonelabDir="$PWD/stage/bonelab" 2>&1 | tee build_mod.log
          rc=${PIPESTATUS[0]}
          ls -la out
          echo "код возврата dotnet: $rc"
          exit $rc

      - name: Итог по мод-сборке
        run: |
          if [ -f out/AuroraRP.dll ]; then
            echo "MOD_BUILT=yes" >> "$GITHUB_ENV"
            echo "AuroraRP.dll собран: $(stat -c%s out/AuroraRP.dll) байт"
          else
            echo "MOD_BUILT=no" >> "$GITHUB_ENV"
            echo "AuroraRP.dll не собирался: не нашлось игровых сборок (см. шаг «Игровые сборки BONELAB»)."
          fi

      - name: Thunderstore-пакет (плагин + мод, если он собрался)
        run: |
          cd AuroraRP/Thunderstore
          mkdir -p Plugins Mods
          cp ../../out/AuroraRPUpdater.dll Plugins/ || true
          cp ../../out/AuroraRP.dll Mods/ || true
          rm -f ../../out/AuroraRP-Thunderstore-1.0.0.zip
          zip -q -r ../../out/AuroraRP-Thunderstore-1.0.0.zip manifest.json README.md icon.png Plugins Mods
          echo "--- что попало в пакет ---"
          unzip -l ../../out/AuroraRP-Thunderstore-1.0.0.zip

      - name: Собрать палет-архив из закоммиченного контента (pallet.json + config)
        run: |
          mkdir -p out
          cd AuroraRP/Pallet
          zip -q -r "../../out/AuroraRP-pallet-src-1.0.0.zip" . -x "ServerData/*"

      - name: Архив проекта целиком (весь код + инструкция)
        run: |
          mkdir -p stage/archive/AuroraRP-1.0.0
          git -c core.quotepath=false ls-files \
            | grep -E '^(AuroraRP/|\.github/)|^(ПРОЧТИ_МЕНЯ\.md|README\.md|release-notes\.md|\.gitignore|СОБРАТЬ_DLL\.cmd|собрать_dll\.sh)$' \
            > stage/archive/list.txt
          xargs -a stage/archive/list.txt cp --parents -t stage/archive/AuroraRP-1.0.0
          (cd stage/archive && zip -q -r "$GITHUB_WORKSPACE/out/AuroraRP-1.0.0-complete.zip" AuroraRP-1.0.0)
          unzip -l out/AuroraRP-1.0.0-complete.zip | tail -3

      - name: Список файлов для релиза
        run: |
          mkdir -p release
          for f in AuroraRP.dll AuroraRPUpdater.dll AuroraRP-Thunderstore-1.0.0.zip AuroraRP-pallet-src-1.0.0.zip AuroraRP-1.0.0-complete.zip; do
            cp "out/$f" "release/$f" 2>/dev/null || true
          done
          echo "--- уедет в релиз ---"
          ls -la release

      - name: Приложить файлы к релизу
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber

      - name: Итог
        run: |
          {
            echo "### AuroraRP: сборка готова"
            echo
            echo "Мод (AuroraRP.dll): **${MOD_BUILT}**"
            echo
            echo "| файл | размер |"
            echo "|---|---|"
            for f in out/*; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(stat -c%s "$f") байт |"
            done
            echo
            if [ "$MOD_BUILT" = "yes" ]; then
              echo "Мод собран целиком: файл приложен к релизу и лежит в Thunderstore-пакете (Mods/)."
            else
              echo "Игровые сборки не найдены, поэтому собран только плагин автообновления."
              echo "Способы отдать сборки: секреты \`BONELAB_ASSEMBLIES_URL\` или \`BONELAB_ASSEMBLIES_REPO\`+\`BONELAB_ASSEMBLIES_PAT\`,"
              echo "либо zip в черновике релиза этого репозитория, либо публичный репозиторий \`ItzHanchik/bonelab-workspace\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: AuroraRP-build
          path: out/*
          if-no-files-found: warn

      - name: Отчёт в ветку ci-report (диагностика сборки для разработчика)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-report
          {
            echo "# Отчёт сборки AuroraRP"
            echo
            echo "- запуск: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- ref: $GITHUB_REF ($GITHUB_SHA)"
            echo "- игровые сборки найдены: ${ASSEMBLIES_FOUND:-нет данных}"
            echo "- мод собран: ${MOD_BUILT:-нет данных}"
            echo
            echo "## Файлы сборки"
            echo '```'
            ls -la out 2>/dev/null || true
            sha256sum out/* 2>/dev/null || true
            echo '```'
            echo
            echo "## Проверка AuroraRP.dll"
            echo '```'
            if [ -f out/AuroraRP.dll ]; then
              echo "размер: $(stat -c%s out/AuroraRP.dll) байт"
              echo "тип:    $(file -b out/AuroraRP.dll)"
              echo "класс AuroraPack в сборке: $(strings -a out/AuroraRP.dll | grep -c 'AuroraPack' || true)"
              echo "встроенный пак aurorarp.pack: $(strings -a out/AuroraRP.dll | grep -c 'aurorarp.pack' || true)"
              echo "ссылки на игровые сборки: $(strings -a out/AuroraRP.dll | grep -cE 'Il2CppSLZ|BoneLib' || true)"
            else
              echo "AuroraRP.dll нет"
            fi
            echo '```'
            echo
            echo "## Лог сборки мода (последние 400 строк)"
            echo '```'
            tail -n 400 build_mod.log 2>/dev/null || echo "(сборка мода не запускалась)"
            echo '```'
          } > ci-report/REPORT.md

          # Готовую DLL (репозиторий приватный) кладём рядом с отчётом —
          # так разработчик может проверить сборку, не скачивая релиз.
          if [ -f out/AuroraRP.dll ] && [ "$(stat -c%s out/AuroraRP.dll)" -lt 45000000 ]; then
            cp out/AuroraRP.dll ci-report/AuroraRP.dll
          fi

          cd ci-report
          git init -q -b ci-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Отчёт сборки $GITHUB_RUN_ID" || true
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-report
